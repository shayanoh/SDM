<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>SDM Settings</title>

    <style>
      :root {
        color-scheme: light dark;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 24px;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
        color: CanvasText;
        background: Canvas;
      }

      .container {
        width: 100%;
        max-width: 520px;
        margin: 0 auto;
      }

      h1 {
        margin: 0 0 20px;
        font-size: 20px;
        font-weight: 600;
      }

      .section {
        border: 1px solid color-mix(in srgb, CanvasText 15%, transparent);
        border-radius: 10px;
        overflow: hidden;
      }

      .setting {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 24px;
        padding: 16px;
      }

      .setting + .setting {
        border-top: 1px solid color-mix(in srgb, CanvasText 12%, transparent);
      }

      .text {
        min-width: 0;
      }

      .title {
        font-size: 14px;
        font-weight: 500;
      }

      .description {
        margin-top: 4px;
        font-size: 12px;
        line-height: 1.4;
        opacity: 0.65;
      }

      /* Simple iOS/macOS-style switch */

      .switch {
        position: relative;
        width: 38px;
        height: 22px;
        flex: 0 0 auto;
      }

      .switch input {
        opacity: 0;
        width: 0;
        height: 0;
      }

      .slider {
        position: absolute;
        inset: 0;
        cursor: pointer;
        border-radius: 999px;
        background: color-mix(in srgb, CanvasText 25%, transparent);
        transition: background 0.15s ease;
      }

      .slider::before {
        content: "";
        position: absolute;
        width: 18px;
        height: 18px;
        left: 2px;
        top: 2px;
        border-radius: 50%;
        background: Canvas;
        box-shadow: 0 1px 3px rgb(0 0 0 / 30%);
        transition: transform 0.15s ease;
      }

      input:checked + .slider {
        background: #0a84ff;
      }

      input:checked + .slider::before {
        transform: translateX(16px);
      }
    </style>
  </head>

  <body>
    <main class="container">
      <h1>SDM</h1>

      <div class="section">
        <div class="setting">
          <div class="text">
            <div class="title">Capture downloads</div>
            <div class="description">
              Send Chrome downloads to SDM instead of downloading them in
              Chrome.
            </div>
          </div>

          <label class="switch">
            <input type="checkbox" id="captureDownloads" />
            <span class="slider"></span>
          </label>
        </div>
        <!--
            <div class="setting">
                <div class="text">
                    <div class="title">Auto-start downloads</div>
                    <div class="description">
                        Start downloads automatically when they are sent to SDM.
                    </div>
                </div>

                <label class="switch">
                    <input
                        type="checkbox"
                        id="autoStartDownloads"
                    >
                    <span class="slider"></span>
                </label>
            </div>
-->
      </div>
    </main>

    <script src="options.js"></script>
  </body>
</html>
