[package]
name = "sdm-tauri"
edition.workspace = true
version.workspace = true
publish.workspace = true
workspace = "../../sdm-core"

[lib]
name = "sdm_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Builds the `--simulate <items> <active>` load harness into a release binary
# (debug builds always have it).
simulate = []

[lints]
workspace = true

[dependencies]
dirs = "6"
sdm-app = { version = "0.1.0", path = "../../sdm-core/crates/sdm-app" }
sdm-browser = { version = "0.1.0", path = "../../sdm-core/crates/sdm-browser" }
sdm-core = { version = "0.1.0", path = "../../sdm-core/crates/sdm-core" }
serde = { version = "1.0.229", features = ["derive"] }
specta = "=2.0.0-rc.25"
specta-typescript = "0.0.12"
tauri = { version = "2.12.5", features = ["image-png", "tray-icon"] }
tauri-plugin-clipboard-manager = "2.5.0"
tauri-plugin-dialog = "2.8.3"
tauri-plugin-notification = "2.7.0"
tauri-plugin-opener = "2.7.2"
tauri-plugin-window-state = "2.5.0"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
tokio = { version = "1.54.1", features = ["time", "rt"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dev-dependencies]
serde_json = "1.0.154"

[target."cfg(windows)".dependencies]
window-vibrancy = "0.8.1"
winreg = "0.56.0"

[target.'cfg(target_os = "linux")'.dependencies]
zbus = "5"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-autostart = "2.7.0"
tauri-plugin-single-instance = "2.5.4"
