[package]
name = "sdm-resolve"
edition.workspace = true
version.workspace = true
publish.workspace = true

[dependencies]
async-trait = "0.1.92"
libc = "0.2.190"
percent-encoding = "2.3.2"
sdm-core = { version = "0.1.0", path = "../sdm-core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["process", "io-util", "time", "rt", "macros", "sync"] }
tokio-util = "0.7.20"
url = "2.5.8"

[features]
# Test doubles (scripted process runners) for this crate's and dependents' tests.
testing = []

[lints]
workspace = true

[dev-dependencies]
tokio = { version = "1.53.2", features = ["rt-multi-thread", "test-util"] }
sdm-resolve = { path = ".", features = ["testing"] }
uuid = { version = "1.28.0", features = ["v4"] }
