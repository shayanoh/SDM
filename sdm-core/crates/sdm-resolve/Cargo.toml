[package]
name = "sdm-resolve"
edition.workspace = true
version.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true

[dependencies]
async-trait = "0.1.92"
hex = "0.4.3"
lzma-rs = "0.3.0"
percent-encoding = "2.3.2"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "http2", "system-proxy"] }
sdm-core = { version = "4.0.1", path = "../sdm-core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.0"
tar = { version = "0.4.46", default-features = false }
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["process", "io-util", "time", "rt", "macros", "sync", "net"] }
tokio-util = "0.7.20"
url = "2.5.8"
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }

[features]
# Test doubles (scripted process runners) for this crate's and dependents' tests.
testing = []

[lints]
workspace = true

[dev-dependencies]
tokio = { version = "1.53.2", features = ["net", "rt-multi-thread", "test-util"] }
sdm-resolve = { path = ".", features = ["testing"] }
uuid = { version = "1.28.0", features = ["v4"] }
tempfile = "3.27.0"

[target."cfg(unix)".dependencies]
libc = "0.2.191"
