[package]
name = "sdm-engine"
edition.workspace = true
version.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true

[dependencies]
async-trait = "0.1.92"
bytes = "1.12.1"
futures = "0.3.34"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "http2", "system-proxy", "stream", "cookies"] }
sdm-core = { version = "4.0.0", path = "../sdm-core" }
sdm-resolve = { version = "4.0.0", path = "../sdm-resolve" }
serde = "1.0.229"
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["rt", "sync", "time", "macros", "fs"] }
tokio-util = "0.7.20"
tracing = "0.1.44"
trash = "5.2.9"
url = "2.5.8"
uuid = "1.28.0"

[lints]
workspace = true

[dev-dependencies]
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["server", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
rand = "0.10.3"
sdm-resolve = { path = "../sdm-resolve", features = ["testing"] }
sha2 = "0.11.0"
tempfile = "3.27.0"
tokio = { version = "1.53.2", features = ["io-util", "net", "rt-multi-thread", "test-util"] }

[features]
# Routes `engine_log!` to `tracing::debug!`. Mirrors Swift's `SDM_ENGINE_LOGGING`.
engine-logging = []

[target."cfg(unix)".dependencies]
libc = "0.2.191"
