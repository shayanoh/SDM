[package]
name = "sdm-ffi"
edition.workspace = true
version.workspace = true
publish.workspace = true

[dependencies]
async-trait = "0.1.92"
futures = "0.3.34"
sdm-core = { version = "0.1.0", path = "../sdm-core" }
sdm-engine = { version = "0.1.0", path = "../sdm-engine" }
sdm-grabber = { version = "0.1.0", path = "../sdm-grabber" }
sdm-resolve = { version = "0.1.0", path = "../sdm-resolve" }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros"] }
tokio-util = "0.7.20"
uniffi = "0.32.2"
url = "2.5.8"
uuid = "1.28.0"

[lints]
workspace = true

[dev-dependencies]
bytes = "1.12.1"
hex = "0.4.3"
sdm-resolve = { path = "../sdm-resolve", features = ["testing"] }
sha2 = "0.11.0"
tempfile = "3.27.0"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros"] }

[lib]
name = "sdm_ffi"
crate-type = ["lib", "staticlib", "cdylib"]
