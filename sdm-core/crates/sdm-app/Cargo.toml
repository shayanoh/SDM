[package]
name = "sdm-app"
edition.workspace = true
version.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true

[dependencies]
async-trait = "0.1.92"
bytes = "1.12.1"
futures = "0.3.34"
percent-encoding = "2.3.2"
sdm-browser = { version = "4.0.1", path = "../sdm-browser" }
sdm-core = { version = "4.0.1", path = "../sdm-core" }
sdm-engine = { version = "4.0.1", path = "../sdm-engine" }
sdm-grabber = { version = "4.0.1", path = "../sdm-grabber" }
sdm-resolve = { version = "4.0.1", path = "../sdm-resolve" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt", "sync", "time", "macros"] }
tracing = "0.1.44"
url = "2.5.8"
uuid = "1.29.0"

[lints]
workspace = true

[dev-dependencies]
sdm-resolve = { path = "../sdm-resolve", features = ["testing"] }
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "test-util"] }
tokio-util = "0.7"
