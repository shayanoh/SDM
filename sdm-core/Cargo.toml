[workspace]
resolver = "3"
members = ["crates/*", "../sdm-tauri/src-tauri"]

[workspace.package]
edition = "2024"
version = "4.0.0"
publish = false

[workspace.lints.clippy]
await_holding_lock = "deny"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[profile.release]
overflow-checks = true
lto = "thin"
codegen-units = 4
panic = "unwind"
debug = "line-tables-only"
